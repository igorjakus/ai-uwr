<!doctype html>
<html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studia AI · UWr</title><link rel="stylesheet" href="style.css"></head><body><main><header><strong>Studia AI</strong><div id="save-status" role="status" hidden></div></header><nav aria-label="Widoki"><button data-view="remaining">Do zrobienia</button><button data-view="history">Historia semestrów</button></nav><section id="content"></section><footer><button id="export">Eksport</button></footer></main><dialog id="editor"><form id="course-form"><h2>Przedmiot</h2><input type="hidden" name="id"><label>Nazwa<input name="name" required maxlength="200"></label><div class="fields"><label>ECTS<input name="ects" type="number" required min="0" max="60" step="0.5"></label><label>Semestr magisterski<select name="semester"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option></select></label><label>Status<select name="status"><option value="active">W trakcie</option><option value="planned">Planowany</option><option value="candidate">Do wyboru</option><option value="completed">Zaliczony</option></select></label></div><label>Uwagi<textarea name="notes" rows="3"></textarea></label><div class="actions"><button type="button" id="close">Anuluj</button><button type="submit">Zapisz</button></div></form></dialog><script src="app.js" defer></script></body></html>
